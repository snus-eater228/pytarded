name: Deploy Ren'Py Web to GitHub Pages
on:
  push:
    branches: ["main"] # Или master, в зависимости от твоего репо
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web' # Путь к папке, которую создал Ren'Py
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4